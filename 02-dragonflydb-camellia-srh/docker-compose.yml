services:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:ubuntu-1.34.2-arm64
    container_name: dragonfly
    # volumes:
    #   - ./redis-1:/data
    command: dragonfly --requirepass redispass --proactor_threads=1

  camellia:
    image: 48n6e/camellia-redis-proxy:1.3.5-jdk-21-0.0.1
    container_name: camellia
    volumes:
      - ./camellia-config/application.yml:/opt/camellia-redis-proxy/BOOT-INF/classes/application.yml
      - ./camellia-config/resource-table.json:/opt/camellia-redis-proxy/BOOT-INF/classes/resource-table.json

  srh:
    image: hiett/serverless-redis-http:0.0.10
    container_name: srh
    ports:
      - "80:80"
    environment:
      - SRH_MODE=env
      - SRH_PORT=80
      - SRH_MAX_CONNECTIONS=420
      - SRH_CONNECTION_STRING=redis://:camelliapass@camellia:6379
      - SRH_TOKEN=kar52RHx11vrydWlcV6jDOoXzAxBd8fI08QVQz3IHP4TzSQaO4P0bRJS7JIlqDK8
