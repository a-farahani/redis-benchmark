services:
  redis:
    image: redis:8-bookworm
    container_name: redis
    # volumes:
    #   - ./redis-1a:/data
    command: redis-server --requirepass redispass

  camellia1:
    image: 48n6e/camellia-redis-proxy:1.3.5-jdk-21-0.0.1
    container_name: camellia1
    volumes:
      - ./camellia-config/application.yml:/opt/camellia-redis-proxy/BOOT-INF/classes/application.yml
      - ./camellia-config/resource-table.json:/opt/camellia-redis-proxy/BOOT-INF/classes/resource-table.json
    depends_on:
      - redis

  camellia2:
    image: 48n6e/camellia-redis-proxy:1.3.5-jdk-21-0.0.1
    container_name: camellia2
    volumes:
      - ./camellia-config/application.yml:/opt/camellia-redis-proxy/BOOT-INF/classes/application.yml
      - ./camellia-config/resource-table.json:/opt/camellia-redis-proxy/BOOT-INF/classes/resource-table.json
    depends_on:
      - redis

  camellia3:
    image: 48n6e/camellia-redis-proxy:1.3.5-jdk-21-0.0.1
