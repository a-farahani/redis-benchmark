services:
  redis-1:
    image: redis:8-bookworm
    container_name: redis-1
    hostname: redis-1
    # volumes:
    #   - ./redis-1:/data
    command: redis-server --requirepass redispass

  redis-2:
    image: redis:8-bookworm
    container_name: redis-2
    hostname: redis-2
    depends_on:
      - redis-1
    # volumes:
    #   - ./redis-2:/data
    command: redis-server --requirepass redispass --masterauth redispass --replicaof redis-1 6379

  redis-3:
    image: redis:8-bookworm
    container_name: redis-3
    hostname: redis-3
    depends_on:
      - redis-1
    # volumes:
    #   - ./redis-3:/data
    command: redis-server --requirepass redispass --masterauth redispass --replicaof redis-1 6379

  sentinel-1:
    image: redis:8-bookworm
    container_name: sentinel-1
    hostname: sentinel-1
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    command: >
      sh -c 'echo "sentinel resolve-hostnames yes" > /etc/sentinel.conf &&
            echo "sentinel monitor mymaster redis-1 6379 2" >> /etc/sentinel.conf &&
            echo "sentinel down-after-milliseconds mymaster 1000" >> /etc/sentinel.conf &&
            echo "sentinel auth-pass mymaster redispass" >> /etc/sentinel.conf &&
            echo "sentinel failover-timeout mymaster 5000" >> /etc/sentinel.conf &&
            echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
            redis-server /etc/sentinel.conf --sentinel'

  sentinel-2:
    image: redis:8-bookworm
    container_name: sentinel-2
    hostname: sentinel-2
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    command: >
      sh -c 'echo "sentinel resolve-hostnames yes" > /etc/sentinel.conf &&
            echo "sentinel monitor mymaster redis-1 6379 2" >> /etc/sentinel.conf &&
            echo "sentinel down-after-milliseconds mymaster 1000" >> /etc/sentinel.conf &&
            echo "sentinel auth-pass mymaster redispass" >> /etc/sentinel.conf &&
            echo "sentinel failover-timeout mymaster 5000" >> /etc/sentinel.conf &&
            echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
            redis-server /etc/sentinel.conf --sentinel'

  sentinel-3:
    image: redis:8-bookworm
    container_name: sentinel-3
    hostname: sentinel-3
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    command: >
      sh -c 'echo "sentinel resolve-hostnames yes" > /etc/sentinel.conf &&
            echo "sentinel monitor mymaster redis-1 6379 2" >> /etc/sentinel.conf &&
            echo "sentinel down-after-milliseconds mymaster 1000" >> /etc/sentinel.conf &&
            echo "sentinel auth-pass mymaster redispass" >> /etc/sentinel.conf &&
            echo "sentinel failover-timeout mymaster 5000" >> /etc/sentinel.conf &&
            echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
            redis-server /etc/sentinel.conf --sentinel'

  camellia:
    image: 48n6e/camellia-redis-proxy:1.3.5-jdk-21-0.0.1
    container_name: camellia
    volumes:
      - ./camellia-config/application.yml:/opt/camellia-redis-proxy/BOOT-INF/classes/application.yml
      - ./camellia-config/resource-table.json:/opt/camellia-redis-proxy/BOOT-INF/classes/resource-table.json
    depends_on:
      - redis-1
      - redis-2
      - redis-3

  srh:
    image: hiett/serverless-redis-http:0.0.10
    environment:
      - SRH_MODE=env
      - SRH_PORT=80
      - SRH_MAX_CONNECTIONS=420
      - SRH_CONNECTION_STRING=redis://:camelliapass@camellia:6379
      - SRH_TOKEN=kar52RHx11vrydWlcV6jDOoXzAxBd8fI08QVQz3IHP4TzSQaO4P0bRJS7JIlqDK8
    depends_on:
      - camellia

  nginx:
    image: nginx:alpine
    container_name: srh-loadbalancer
    ports:
      - "80:80"
    volumes:
      - ./nginx-config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - srh
