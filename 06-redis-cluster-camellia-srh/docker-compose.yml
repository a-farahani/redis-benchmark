services:
  redis-1:
    image: redis:8-bookworm
    container_name: redis-1
    hostname: redis-1
    command: >
      sh -c 'mkdir -p /etc/redis &&
             echo "port 6379" > /etc/redis/redis.conf &&
             echo "bind 0.0.0.0" >> /etc/redis/redis.conf &&
             echo "cluster-enabled yes" >> /etc/redis/redis.conf &&
             echo "cluster-config-file nodes.conf" >> /etc/redis/redis.conf &&
             echo "cluster-node-timeout 5000" >> /etc/redis/redis.conf &&
             echo "cluster-announce-ip redis-1" >> /etc/redis/redis.conf &&
             echo "cluster-announce-port 6379" >> /etc/redis/redis.conf &&
             echo "cluster-announce-bus-port 16379" >> /etc/redis/redis.conf &&
             echo "requirepass redispass" >> /etc/redis/redis.conf &&
             echo "masterauth redispass" >> /etc/redis/redis.conf &&
             redis-server /etc/redis/redis.conf'
    # volumes:
    #     - ./redis-1:/data
    #     - ./redis-1/conf/redis.conf:/etc/redis/redis.conf

